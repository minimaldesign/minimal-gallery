# Releases with changesets. On every push to master, changesets/action
# either opens (or updates) a “Version packages” pull request that applies
# the pending changesets (versions and CHANGELOG.md files), or, when that
# pull request has just been merged and nothing is pending, publishes the
# four packages to npm and creates their git tags and GitHub releases.
# The repository uses Changesets CLI v3, which needs changesets/action v2.
#
# DISABLED until the first release. Only the manual trigger is on, and the
# job stops unless RELEASES_ENABLED is set. Publishing uses npm trusted
# publishing (no stored token), which can only be set up on packages that
# already exist, so 2.0.0 is published once by hand:
#   1. Publish 2.0.0 from Yann’s Mac: `pnpm exec changeset pre exit`,
#      `pnpm exec changeset version`, commit and push. Then `npm login`,
#      `pnpm release` (asks for the 2FA code) and `git push --follow-tags`.
#   2. npmjs.com, for each of the four packages: Settings > Trusted
#      publisher > GitHub Actions, repository minimaldesign/minimal-gallery,
#      workflow release.yml. Then set publishing access to disallow tokens.
#   3. Repository settings > Actions > General: allow GitHub Actions to
#      create and approve pull requests.
#   4. Repository settings > Secrets and variables > Actions > Variables:
#      set RELEASES_ENABLED to true.
#   5. Uncomment the push trigger below.
# Not tested yet: whether `changeset publish` through pnpm picks up trusted
# publishing the way `npm publish` does. If the first automated release
# fails to authenticate, make the publish step call `npm publish`.

name: Release

on:
  # push:
  #   branches: [master]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  # npm provenance and trusted publishing
  id-token: write

jobs:
  # Nothing is published unless the packages install on a clean computer.
  clean-install:
    if: vars.RELEASES_ENABLED == 'true'
    uses: ./.github/workflows/clean-install.yml

  release:
    needs: clean-install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # The pnpm version comes from packageManager in package.json.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test

      - uses: changesets/action@v2
        with:
          pr-title: Version packages
          commit-message: Version packages
          # applies the pending changesets: versions and CHANGELOG.md files
          version-script: pnpm exec changeset version
          # pnpm release is pnpm build && changeset publish
          publish-script: pnpm release
          create-github-releases: true
        env:
          # trusted publishing: npm exchanges the id-token for a short-lived
          # publish token, so no NPM_TOKEN secret is needed
          NPM_CONFIG_PROVENANCE: true
